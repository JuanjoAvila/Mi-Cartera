name: Promocionar beta a producción

# La otra mitad del flujo de pruebas: cuando la beta ya está probada EN EL MÓVIL y aprobada desde
# Ajustes → Dev → Pruebas → Revisar esta beta, esto la sube a producción.
#
# Se lanza A MANO (Actions → este workflow → «Run workflow») a propósito: subir algo a producción
# es lo que ven el padre y la pareja, y no debe poder dispararlo nada automático. Mergea `beta` en
# `main` y **arranca el deploy de Pages a mano** (ver el paso del final: el push de aquí no lo
# dispara solo), y no se da por bueno hasta comprobar que producción sirve la versión nueva.
#
# ¿Por qué no lo lanza la app directamente? Haría falta guardar un token de GitHub con permiso de
# escritura sobre el repo en Supabase, y eso es una credencial nueva y jugosa a cambio de ahorrar
# un clic. No compensa (misma lógica que AGENTS.md §9 sobre secretos).

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe SUBIR para confirmar (la verá tu padre y tu pareja)'
        required: true
        default: ''

permissions:
  contents: write
  # `actions: write` hace falta para el `gh workflow run deploy.yml` del final: sin él la API
  # responde 403 «Resource not accessible by integration» y la promoción se queda con `main` ya
  # mergeado pero producción sirviendo lo viejo (pasó el 2026-07-28 subiendo la 4.12.1).
  actions: write

concurrency:
  group: promote-beta
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar la confirmación
        if: ${{ inputs.confirmar != 'SUBIR' }}
        run: |
          echo "::error::Hay que escribir SUBIR para confirmar. No se ha tocado nada."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Hay algo que subir?
        run: |
          git fetch origin main beta
          if [ -z "$(git log origin/main..origin/beta --oneline)" ]; then
            echo "::error::`beta` no tiene nada que `main` no tenga ya. Nada que promocionar."
            exit 1
          fi
          echo "### Se va a subir a producción" >> $GITHUB_STEP_SUMMARY
          git log origin/main..origin/beta --oneline >> $GITHUB_STEP_SUMMARY

      # Los mismos tests que el deploy: que una beta esté probada a mano no exime de la suite.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ⚠ `git checkout beta` A SECAS NO VALE: la release rodante de pruebas crea un **tag**
      # llamado `beta`, así que el nombre es ambiguo y git se queda con el TAG. Esto estuvo
      # ejecutando los tests contra un árbol de hace semanas (detectado el 2026-07-28: la
      # promoción fallaba por una prueba que ya estaba arreglada en la rama). O sea que la red de
      # seguridad no miraba lo que se iba a publicar. `-B ... origin/beta` es inequívoco.
      - name: Tests
        run: |
          git checkout -B beta origin/beta
          git log -1 --oneline
          npm ci
          npx playwright install chromium --with-deps
          node scripts/run-tests.mjs

      - name: Mergear beta → main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff origin/beta -m "Promocionar beta a producción (probada y aprobada en el móvil)"
          git push origin main

      # ⚠ ESTE PASO NO SOBRA: un push hecho con el GITHUB_TOKEN del propio workflow **NO dispara
      # otros workflows** (protección de GitHub contra bucles infinitos). O sea que el `push` de
      # arriba NO arranca el deploy de Pages, y la promoción se quedaba a medias EN SILENCIO:
      # `main` con la versión nueva y producción sirviendo la vieja. Pasó la primera vez que esto
      # se usó de verdad (2026-07-26, promoción de la 4.11.0): los tres runs en verde y Pages
      # todavía en la 4.10.2. Un `workflow_dispatch` por API sí arranca, aun con el mismo token.
      - name: Arrancar el deploy de Pages (el push no lo hace)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # Y no nos fiamos de que haya arrancado: se comprueba que producción sirve de verdad la
      # versión nueva. Una promoción que no llega a Pages no es una promoción.
      - name: Comprobar que producción ya sirve la versión nueva
        run: |
          VERSION=$(git show origin/beta:VERSION | tr -d '[:space:]')
          echo "Esperando a que Pages sirva $VERSION…"
          LIVE=""
          for i in $(seq 1 40); do
            LIVE=$(curl -sL "https://juanjoavila.github.io/Mi-Cartera/version.json" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$LIVE" = "$VERSION" ]; then
              echo "✅ Producción sirve $LIVE" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            sleep 15
          done
          echo "::error::Pages sigue sirviendo «$LIVE» y esperábamos «$VERSION». Mira el run de «Deploy a GitHub Pages»."
          exit 1

      - name: Resumen
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Subido a \`main\` y publicado. La app se lo ofrece sola a todo el mundo." >> $GITHUB_STEP_SUMMARY
